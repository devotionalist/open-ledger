apiVersion: apps/v1
kind: Deployment
metadata:
  name: openledger-admin
  namespace: open-ledger
spec:
  template:
    spec:
      containers:
        - name: admin
          args:
            - --coord-backend=openkv
            - --openkv=gateway.openkv.svc.cluster.local:19000
            - --listen=0.0.0.0:8080
            - --refresh-secs=5
          env:
            - name: COORD_BACKEND
              value: openkv
            - name: OPENKV_ADDR
              value: gateway.openkv.svc.cluster.local:19000
            - name: RUST_LOG
              value: info
            - name: RUST_LOG_FORMAT
              value: json
