# Switch AR + admin from Oxia to OpenKV Gateway.
# Prereq: OpenKV in namespace `openkv` (Service `gateway:19000`).
#
#   kubectl apply -k deploy/overlays/openkv
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: open-ledger
resources:
  - ../../k8s
patches:
  - path: patch-bookie-openkv.yaml
  - path: patch-admin-openkv.yaml
